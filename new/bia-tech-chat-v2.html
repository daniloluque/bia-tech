<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BIA Tech — Chat</title>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@300;400;500;700&display=swap"
    rel="stylesheet">
  <style>
    /* ─── BRAND ─── */
    :root {
      --red: #CC092F;
      --red-dark: #A00725;
      --cyan: #00BCD4;
      --cyan-dark: #0097A7;
      --success: #2E7D32;
      --warning: #F9A825;
      --error: #D32F2F;
      --info: #1565C0;
    }

    [data-theme="dark"] {
      --bg: #1E1E1E;
      --bg2: #252525;
      --surf: #252525;
      --surf2: #2D2D2D;
      --surf3: #363636;
      --surf4: #404040;
      --bord: rgba(255, 255, 255, 0.1);
      --bord-s: rgba(255, 255, 255, 0.06);
      --bord-cyan: rgba(0, 188, 212, 0.35);
      --t1: #EFEFEF;
      --t2: #A0A0A0;
      --t3: #777777;
      --t4: #444444;
      --inp: #1B1B1B;
      --inp-bord: rgba(255, 255, 255, 0.15);
      --inp-focus: rgba(0, 188, 212, 0.3);
      --topbar: #252525;
      --topbar-bord: rgba(255, 255, 255, 0.1);
      --sb: #1E1E1E;
      --sb-bord: rgba(255, 255, 255, 0.08);
      --sb-hover: rgba(255, 255, 255, 0.06);
      --sb-active: rgba(255, 255, 255, 0.1);
      --scroll: #3D3D3D;
      --code-bg: #161616;
      --code-bord: rgba(255, 255, 255, 0.08);
      --inline-bg: rgba(255, 255, 255, 0.1);
      --sep: #2D2D2D;
      --pill-bg: rgba(255, 255, 255, 0.08);
      --pill-bord: rgba(255, 255, 255, 0.12);
      --pill-col: #AAA;
      --drop-bg: #2D2D2D;
      --drop-bord: rgba(255, 255, 255, 0.15);
      --drop-shadow: 0 16px 48px rgba(0, 0, 0, 0.4);
      --bub-shadow: 0 12px 32px rgba(0, 0, 0, 0.3);
      --drop-hover: rgba(255, 255, 255, 0.08);
      --user-bubble: #2A2A2A;
      --user-bub-bord: rgba(255, 255, 255, 0.08);
    }

    [data-theme="light"] {
      --bg: #FFFFFF;
      --bg2: #F8F8F8;
      --surf: #FFFFFF;
      --surf2: #F8F8F8;
      --surf3: #F0F0F0;
      --surf4: #E8E8E8;
      --bord: rgba(0, 0, 0, 0.09);
      --bord-s: rgba(0, 0, 0, 0.05);
      --bord-cyan: rgba(0, 188, 212, 0.4);
      --t1: #1A1A1A;
      --t2: #666;
      --t3: #AAA;
      --t4: #DDD;
      --inp: #FFF;
      --inp-bord: rgba(0, 0, 0, 0.12);
      --inp-focus: rgba(0, 188, 212, 0.25);
      --topbar: #FFF;
      --topbar-bord: rgba(0, 0, 0, 0.08);
      --sb: #FFF;
      --sb-bord: rgba(0, 0, 0, 0.07);
      --sb-hover: rgba(0, 0, 0, 0.03);
      --sb-active: rgba(0, 0, 0, 0.06);
      --scroll: #CCC;
      --code-bg: #F8F8F8;
      --code-bord: rgba(0, 0, 0, 0.07);
      --inline-bg: rgba(0, 0, 0, 0.06);
      --sep: #E5E5E5;
      --pill-bg: rgba(0, 0, 0, 0.04);
      --pill-bord: rgba(0, 0, 0, 0.09);
      --pill-col: #888;
      --drop-bg: #FFFFFF;
      --drop-bord: rgba(0, 0, 0, 0.1);
      --drop-shadow: 0 16px 48px rgba(0, 0, 0, 0.12);
      --bub-shadow: 0 12px 32px rgba(0, 0, 0, 0.06);
      --drop-hover: rgba(0, 0, 0, 0.04);
      --user-bubble: #F8F8F8;
      --user-bub-bord: rgba(0, 0, 0, 0.07);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--t1);
      height: 100vh;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
      transition: background .2s, color .2s;
    }

    /* ── TOPBAR ── */
    .topbar {
      height: 50px;
      background: var(--topbar);
      border-bottom: .5px solid var(--topbar-bord);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      position: relative;
      z-index: 300;
      transition: background .2s, border-color .2s;
      flex-shrink: 0;
    }

    .topbar-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .topbar-right {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .wordmark {
      display: flex;
      align-items: center;
      font-size: 15px;
      user-select: none;
    }

    .wordmark .bia {
      font-weight: 700;
      color: var(--red);
    }

    .wordmark .pipe {
      font-weight: 300;
      color: var(--t3);
      margin: 0 4px;
    }

    .wordmark .tech {
      font-weight: 300;
      color: var(--t1);
    }

    .topbar-sep {
      width: .5px;
      height: 16px;
      background: var(--bord);
    }

    .session-label {
      font-size: 12px;
      font-weight: 500;
      color: var(--t2);
      max-width: 200px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* ── AGENT SELECTOR (topbar) ── */
    .agent-selector {
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--surf2);
      border: .5px solid var(--bord);
      border-radius: 8px;
      padding: 6px 12px;
      cursor: pointer;
      transition: all .15s;
      position: relative;
      min-width: 180px;
    }

    .agent-selector:hover {
      border-color: var(--bord-cyan);
    }

    .agent-selector.open {
      border-color: var(--bord-cyan);
      box-shadow: 0 0 0 3px rgba(0, 188, 212, .1);
    }

    .agent-icon {
      font-size: 16px;
      flex-shrink: 0;
    }

    .agent-sel-info {
      flex: 1;
      overflow: hidden;
    }

    .agent-sel-name {
      font-size: 12px;
      font-weight: 600;
      color: var(--t1);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .agent-sel-role {
      font-size: 9px;
      color: var(--t3);
      font-family: 'JetBrains Mono', monospace;
      white-space: nowrap;
    }

    .agent-chevron {
      color: var(--t3);
      flex-shrink: 0;
      transition: transform .2s;
    }

    .agent-selector.open .agent-chevron {
      transform: rotate(180deg);
    }

    /* ── MODEL SELECTOR (topbar) ── */
    .model-selector {
      display: flex;
      align-items: center;
      gap: 7px;
      background: var(--surf2);
      border: .5px solid var(--bord);
      border-radius: 8px;
      padding: 6px 10px;
      cursor: pointer;
      transition: all .15s;
      position: relative;
    }

    .model-selector:hover {
      border-color: var(--bord-cyan);
    }

    .model-selector.open {
      border-color: var(--bord-cyan);
      box-shadow: 0 0 0 3px rgba(0, 188, 212, .1);
    }

    .model-logo {
      width: 18px;
      height: 18px;
      border-radius: 4px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
    }

    .model-sel-name {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      font-weight: 500;
      color: var(--t1);
    }

    .model-sel-sub {
      font-family: 'JetBrains Mono', monospace;
      font-size: 9px;
      color: var(--t3);
    }

    /* ── DROPDOWNS ── */
    .dropdown {
      position: absolute;
      top: calc(100% + 8px);
      left: 0;
      background: var(--drop-bg);
      border: .5px solid var(--drop-bord);
      border-radius: 12px;
      box-shadow: var(--drop-shadow);
      z-index: 500;
      overflow: hidden;
      opacity: 0;
      transform: translateY(-8px) scale(.98);
      pointer-events: none;
      transition: opacity .18s, transform .18s;
      min-width: 260px;
    }

    .dropdown.open {
      opacity: 1;
      transform: translateY(0) scale(1);
      pointer-events: all;
    }

    .drop-header {
      padding: 10px 14px 8px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 9px;
      color: var(--t3);
      letter-spacing: .14em;
      text-transform: uppercase;
      border-bottom: .5px solid var(--bord-s);
    }

    .drop-item {
      display: flex;
      align-items: center;
      gap: 11px;
      padding: 10px 14px;
      cursor: pointer;
      transition: background .12s;
      border-bottom: .5px solid var(--bord-s);
    }

    .drop-item:last-child {
      border-bottom: none;
    }

    .drop-item:hover {
      background: var(--drop-hover);
    }

    .drop-item.selected {
      background: rgba(0, 188, 212, .06);
    }

    .drop-icon {
      width: 34px;
      height: 34px;
      border-radius: 9px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
    }

    .drop-info {
      flex: 1;
      overflow: hidden;
    }

    .drop-name {
      font-size: 12px;
      font-weight: 600;
      color: var(--t1);
      margin-bottom: 2px;
    }

    .drop-desc {
      font-size: 10px;
      color: var(--t3);
      line-height: 1.4;
    }

    .drop-check {
      width: 16px;
      height: 16px;
      border-radius: 4px;
      background: rgba(0, 188, 212, .15);
      border: .5px solid rgba(0, 188, 212, .4);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    /* model drop */
    .model-drop {
      left: 0;
      min-width: 320px;
    }

    .model-drop-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 14px;
      cursor: pointer;
      transition: background .12s;
      border-bottom: .5px solid var(--bord-s);
    }

    .model-drop-item:last-child {
      border-bottom: none;
    }

    .model-drop-item:hover {
      background: var(--drop-hover);
    }

    .model-drop-item.selected {
      background: rgba(0, 188, 212, .06);
    }

    .model-logo-big {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 15px;
      flex-shrink: 0;
    }

    .model-info {
      flex: 1;
    }

    .model-name {
      font-size: 12px;
      font-weight: 600;
      color: var(--t1);
      margin-bottom: 2px;
    }

    .model-desc {
      font-size: 10px;
      color: var(--t3);
    }

    .model-tags {
      display: flex;
      gap: 4px;
      margin-top: 4px;
    }

    .mtag {
      font-family: 'JetBrains Mono', monospace;
      font-size: 8px;
      padding: 1px 6px;
      border-radius: 3px;
      font-weight: 500;
    }

    .mtag-fast {
      background: rgba(249, 168, 37, .12);
      color: #F9A825;
    }

    .mtag-smart {
      background: rgba(0, 188, 212, .1);
      color: var(--cyan);
    }

    .mtag-reason {
      background: rgba(21, 101, 192, .12);
      color: #64B5F6;
    }

    .mtag-vision {
      background: rgba(123, 31, 162, .12);
      color: #CE93D8;
    }

    .mtag-code {
      background: rgba(46, 125, 50, .12);
      color: #81C784;
    }

    .model-badge {
      font-family: 'JetBrains Mono', monospace;
      font-size: 9px;
      padding: 2px 7px;
      border-radius: 3px;
      flex-shrink: 0;
    }

    /* mini selectors (for input bar) */
    .agent-selector.mini,
    .model-selector.mini {
      min-width: 0;
      width: 28px;
      height: 28px;
      padding: 0;
      background: none;
      display: flex;
      align-items: center;
      justify-content: center;
      border: .5px solid var(--bord);
      border-radius: 6px;
      color: var(--t3);
      margin: 0;
      box-shadow: none;
      flex-shrink: 0;
      cursor: pointer;
      transition: all .15s;
      position: relative;
    }

    .agent-selector.mini:hover,
    .model-selector.mini:hover {
      background: var(--surf2);
      color: var(--t2);
      border-color: var(--bord);
    }

    .agent-selector.mini.open,
    .model-selector.mini.open {
      background: var(--surf2);
      border-color: var(--bord-cyan);
      color: var(--cyan);
      box-shadow: none;
    }

    .dropdown.mini-drop {
      top: auto;
      bottom: calc(100% + 12px);
      left: auto;
      right: -10px;
      transform: translateY(8px) scale(.98);
    }

    .dropdown.mini-drop.open {
      transform: translateY(0) scale(1);
    }

    /* ── ICON BTN ── */
    .icon-btn {
      width: 30px;
      height: 30px;
      border-radius: 7px;
      background: none;
      border: .5px solid var(--bord);
      cursor: pointer;
      color: var(--t3);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all .15s;
    }

    .icon-btn:hover {
      color: var(--t2);
      background: var(--surf2);
    }

    /* theme toggle */
    .theme-toggle {
      display: flex;
      align-items: center;
      gap: 6px;
      background: var(--pill-bg);
      border: .5px solid var(--pill-bord);
      border-radius: 20px;
      padding: 4px 10px;
      cursor: pointer;
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      color: var(--pill-col);
      transition: all .15s;
      white-space: nowrap;
    }

    .theme-toggle:hover {
      border-color: rgba(0, 188, 212, .4);
      color: var(--cyan);
    }

    /* ── LAYOUT ── */
    .app {
      display: flex;
      height: calc(100vh - 50px);
    }

    /* ── SIDEBAR ── */
    .sidebar {
      width: 230px;
      min-width: 230px;
      background: var(--sb);
      border-right: .5px solid var(--sb-bord);
      display: flex;
      flex-direction: column;
      transition: background .2s, border-color .2s;
    }

    .sidebar-top {
      padding: 12px;
      border-bottom: .5px solid var(--sb-bord);
    }

    .new-chat-btn {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(204, 9, 47, .08);
      border: .5px solid rgba(204, 9, 47, .2);
      border-radius: 8px;
      padding: 8px 12px;
      font-size: 12px;
      font-weight: 500;
      color: var(--red);
      cursor: pointer;
      transition: all .15s;
    }

    .new-chat-btn:hover {
      background: rgba(204, 9, 47, .14);
    }

    .sb-section {
      font-family: 'JetBrains Mono', monospace;
      font-size: 9px;
      font-weight: 500;
      letter-spacing: .14em;
      text-transform: uppercase;
      color: var(--t3);
      padding: 12px 12px 6px;
    }

    .conv-list {
      overflow-y: auto;
      flex: 1;
      padding: 0 6px 8px;
    }

    .conv-list::-webkit-scrollbar {
      width: 3px;
    }

    .conv-list::-webkit-scrollbar-thumb {
      background: var(--scroll);
      border-radius: 2px;
    }

    .conv-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 7px 8px;
      border-radius: 7px;
      cursor: pointer;
      transition: background .12s;
      margin-bottom: 1px;
    }

    .conv-item:hover {
      background: var(--sb-hover);
    }

    .conv-item.active {
      background: var(--sb-active);
    }

    .conv-ico {
      width: 26px;
      height: 26px;
      border-radius: 6px;
      background: var(--surf3);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      flex-shrink: 0;
      transition: background .2s;
    }

    .conv-item.active .conv-ico {
      background: rgba(0, 188, 212, .12);
    }

    .conv-body {
      flex: 1;
      overflow: hidden;
    }

    .conv-title {
      font-size: 12px;
      font-weight: 500;
      color: var(--t1);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .conv-meta {
      font-family: 'JetBrains Mono', monospace;
      font-size: 9px;
      color: var(--t3);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-top: 1px;
    }

    .conv-tag {
      font-family: 'JetBrains Mono', monospace;
      font-size: 8px;
      padding: 1px 5px;
      border-radius: 2px;
      flex-shrink: 0;
    }

    .sb-footer {
      padding: 12px;
      border-top: .5px solid var(--sb-bord);
      display: flex;
      align-items: center;
      gap: 9px;
    }

    .user-avatar {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: var(--red);
      color: #fff;
      font-size: 11px;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .user-name {
      font-size: 12px;
      font-weight: 500;
      color: var(--t2);
    }

    .user-role {
      font-size: 10px;
      color: var(--t3);
      font-family: 'JetBrains Mono', monospace;
    }

    /* ── CHAT AREA ── */
    .chat-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: var(--bg);
      transition: background .2s;
    }

    /* chat header */
    .chat-header {
      padding: 11px 20px;
      border-bottom: .5px solid var(--bord);
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
      background: var(--surf);
      transition: background .2s, border-color .2s;
    }

    .chat-header-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .chat-agent-badge {
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 4px 10px;
      border-radius: 20px;
      background: var(--surf2);
      border: .5px solid var(--bord);
    }

    .chat-agent-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      animation: pulse-dot 2s infinite;
    }

    @keyframes pulse-dot {

      0%,
      100% {
        opacity: 1;
      }

      50% {
        opacity: .2;
      }
    }

    .chat-agent-name {
      font-size: 11px;
      font-weight: 500;
      color: var(--t1);
    }

    .chat-agent-model {
      font-family: 'JetBrains Mono', monospace;
      font-size: 9px;
      color: var(--t3);
    }

    .chat-title-text {
      font-size: 13px;
      font-weight: 600;
      color: var(--t1);
    }

    .chat-title-meta {
      font-family: 'JetBrains Mono', monospace;
      font-size: 9px;
      color: var(--t3);
      margin-top: 1px;
    }

    .chat-header-actions {
      display: flex;
      gap: 6px;
    }

    /* capability chips */
    .cap-chips {
      padding: 8px 20px;
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
      border-bottom: .5px solid var(--bord-s);
      flex-shrink: 0;
      transition: border-color .2s;
      animation: slideDown .25s ease;
    }

    @keyframes slideDown {
      from {
        opacity: 0;
        transform: translateY(-6px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .cap-chip {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 10px;
      font-weight: 500;
      background: var(--pill-bg);
      border: .5px solid var(--pill-bord);
      color: var(--pill-col);
      border-radius: 20px;
      padding: 3px 9px;
      cursor: default;
      transition: all .15s;
    }

    .cap-chip.active {
      background: rgba(0, 188, 212, .1);
      border-color: rgba(0, 188, 212, .3);
      color: var(--cyan);
    }

    .cap-chip-dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
    }

    /* messages */
    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 24px 20px 8px;
      display: flex;
      flex-direction: column;
      gap: 0;
      align-items: center;
    }

    .messages::-webkit-scrollbar {
      width: 4px;
    }

    .messages::-webkit-scrollbar-thumb {
      background: var(--scroll);
      border-radius: 2px;
    }

    .msg-wrap {
      padding: 3px 0;
      animation: fadeUp .2s ease;
      width: 100%;
      max-width: 880px;
    }

    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(6px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* date separator */
    .date-sep {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 14px 0 8px;
      width: 100%;
      max-width: 880px;
      align-self: center;
    }

    .date-line {
      flex: 1;
      height: .5px;
      background: var(--sep);
    }

    .date-text {
      font-family: 'JetBrains Mono', monospace;
      font-size: 9px;
      letter-spacing: .1em;
      color: var(--t3);
      white-space: nowrap;
    }

    /* message rows */
    .msg-row {
      display: flex;
      gap: 11px;
      align-items: flex-start;
      max-width: 880px;
    }

    .msg-row.user-row {
      margin-left: auto;
      flex-direction: row-reverse;
      max-width: 680px;
    }

    .msg-avatar {
      width: 28px;
      height: 28px;
      border-radius: 5px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-top: 2px;
    }

    .msg-avatar.bia {
      background: var(--red);
    }

    .msg-avatar.user {
      background: var(--surf3);
      border: .5px solid var(--bord);
    }

    .msg-content {
      flex: 1;
    }

    .msg-header {
      display: flex;
      align-items: center;
      gap: 7px;
      margin-bottom: 5px;
    }

    .msg-author {
      font-size: 11px;
      font-weight: 600;
      color: var(--t1);
    }

    .msg-author.bia {
      color: var(--red);
    }

    .msg-time {
      font-family: 'JetBrains Mono', monospace;
      font-size: 9px;
      color: var(--t3);
    }

    /* user bubble */
    .msg-row.user-row .msg-content {
      background: var(--user-bubble);
      border: .5px solid var(--user-bub-bord);
      border-radius: 12px 2px 12px 12px;
      padding: 10px 14px;
    }

    .msg-row.user-row .msg-header {
      flex-direction: row-reverse;
    }

    .msg-body {
      font-size: 13.5px;
      color: var(--t1);
      line-height: 1.72;
    }

    .msg-body p {
      margin-bottom: 10px;
    }

    .msg-body p:last-child {
      margin-bottom: 0;
    }

    .msg-body strong {
      font-weight: 600;
    }

    /* inline code */
    .msg-body code {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11.5px;
      background: var(--inline-bg);
      color: var(--cyan);
      padding: 1px 5px;
      border-radius: 3px;
    }

    /* code block */
    .code-block {
      background: var(--code-bg);
      border: .5px solid var(--code-bord);
      border-radius: 9px;
      margin: 12px 0;
      overflow: hidden;
      animation: fadeUp .2s ease;
      transition: background .2s, border-color .2s;
    }

    .code-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 14px;
      border-bottom: .5px solid var(--code-bord);
    }

    .code-lang {
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      font-weight: 500;
      color: var(--cyan);
      letter-spacing: .06em;
    }

    .code-actions {
      display: flex;
      gap: 6px;
      align-items: center;
    }

    .code-copy {
      font-family: 'JetBrains Mono', monospace;
      font-size: 9px;
      color: var(--t3);
      background: none;
      border: .5px solid transparent;
      border-radius: 4px;
      padding: 2px 7px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
      transition: all .15s;
    }

    .code-copy:hover {
      color: var(--t2);
      border-color: var(--bord);
      background: var(--surf2);
    }

    .code-run {
      font-family: 'JetBrains Mono', monospace;
      font-size: 9px;
      background: rgba(0, 188, 212, .1);
      border: .5px solid rgba(0, 188, 212, .25);
      color: var(--cyan);
      border-radius: 4px;
      padding: 2px 8px;
      cursor: pointer;
      transition: all .15s;
    }

    .code-run:hover {
      background: rgba(0, 188, 212, .18);
    }

    .code-body {
      padding: 14px;
      overflow-x: auto;
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      line-height: 1.8;
      color: var(--t1);
    }

    .code-body::-webkit-scrollbar {
      height: 3px;
    }

    .code-body::-webkit-scrollbar-thumb {
      background: var(--scroll);
      border-radius: 2px;
    }

    .tok-kw {
      color: var(--red);
      font-weight: 500;
    }

    .tok-fn {
      color: var(--cyan);
    }

    .tok-str {
      color: #81C784;
    }

    .tok-cmt {
      color: var(--t3);
      font-style: italic;
    }

    .tok-num {
      color: #F9A825;
    }

    .tok-type {
      color: #CE93D8;
    }

    /* tool block */
    .tool-block {
      display: flex;
      align-items: flex-start;
      gap: 9px;
      background: rgba(0, 188, 212, .05);
      border: .5px solid rgba(0, 188, 212, .15);
      border-radius: 8px;
      padding: 9px 13px;
      margin: 8px 0;
      animation: fadeUp .2s ease;
      transition: background .2s;
    }

    .tool-ico {
      width: 22px;
      height: 22px;
      border-radius: 5px;
      background: rgba(0, 188, 212, .12);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      margin-top: 1px;
    }

    .tool-name {
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      font-weight: 500;
      color: var(--cyan);
      margin-bottom: 1px;
    }

    .tool-desc-txt {
      font-size: 10px;
      color: var(--t2);
    }

    .tool-stat {
      font-family: 'JetBrains Mono', monospace;
      font-size: 9px;
      padding: 2px 7px;
      border-radius: 3px;
      flex-shrink: 0;
      align-self: center;
    }

    .tool-stat.done {
      background: rgba(46, 125, 50, .12);
      color: #81C784;
      border: .5px solid rgba(46, 125, 50, .2);
    }

    .tool-stat.running {
      background: rgba(0, 188, 212, .1);
      color: var(--cyan);
      border: .5px solid rgba(0, 188, 212, .2);
      animation: blink-a 1.4s infinite;
    }

    @keyframes blink-a {

      0%,
      100% {
        opacity: 1;
      }

      50% {
        opacity: .35;
      }
    }

    /* thinking */
    .thinking-block {
      border-left: 2px solid var(--t3);
      margin: 6px 0 10px;
      padding: 3px 0 3px 12px;
      color: var(--t3);
      font-size: 11.5px;
      font-style: italic;
      animation: fadeUp .2s ease;
    }

    /* typing */
    .typing-row {
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 4px 0;
    }

    .tdot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: var(--t3);
      animation: typing 1.4s ease infinite;
    }

    .tdot:nth-child(2) {
      animation-delay: .2s;
    }

    .tdot:nth-child(3) {
      animation-delay: .4s;
    }

    @keyframes typing {

      0%,
      80%,
      100% {
        transform: scale(1);
        opacity: .4;
      }

      40% {
        transform: scale(1.3);
        opacity: 1;
      }
    }

    /* streaming cursor */
    .stream-cursor {
      display: inline-block;
      width: 2px;
      height: 14px;
      background: var(--cyan);
      margin-left: 2px;
      vertical-align: middle;
      border-radius: 1px;
      animation: blink-cur .7s step-end infinite;
    }

    @keyframes blink-cur {

      0%,
      100% {
        opacity: 1;
      }

      50% {
        opacity: 0;
      }
    }

    /* ia badge */
    .ia-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background: rgba(0, 188, 212, .1);
      border: .5px solid rgba(0, 188, 212, .25);
      border-radius: 3px;
      padding: 1px 7px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 9px;
      color: var(--cyan);
    }

    /* reaction bar */
    .reaction-bar {
      display: flex;
      align-items: center;
      gap: 4px;
      margin-top: 6px;
      opacity: 0;
      transition: opacity .2s;
    }

    .msg-wrap:hover .reaction-bar {
      opacity: 1;
    }

    .react-btn {
      font-size: 11px;
      padding: 2px 6px;
      border-radius: 4px;
      border: .5px solid var(--bord);
      background: none;
      cursor: pointer;
      color: var(--t3);
      transition: all .15s;
    }

    .react-btn:hover {
      background: var(--surf2);
      color: var(--t2);
    }

    .react-btn.active {
      background: rgba(0, 188, 212, .1);
      border-color: rgba(0, 188, 212, .3);
      color: var(--cyan);
    }

    .copy-msg-btn {
      font-family: 'JetBrains Mono', monospace;
      font-size: 9px;
      padding: 2px 7px;
      border-radius: 4px;
      border: .5px solid var(--bord);
      background: none;
      cursor: pointer;
      color: var(--t3);
      transition: all .15s;
      display: flex;
      align-items: center;
      gap: 3px;
    }

    .copy-msg-btn:hover {
      background: var(--surf2);
      color: var(--t2);
    }

    /* ── QUICK ACTIONS (agent specific) ── */
    .quick-actions {
      display: flex;
      gap: 8px;
      flex-shrink: 0;
      overflow-x: auto;
      scrollbar-width: none;
      width: 100%;
      max-width: 880px;
      margin-bottom: 12px;
      animation: fadeUp .2s ease;
    }

    .quick-actions::-webkit-scrollbar {
      display: none;
    }

    .qa-btn {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
      font-size: 11px;
      font-weight: 500;
      background: var(--surf2);
      border: .5px solid var(--bord);
      color: var(--t2);
      border-radius: 20px;
      padding: 5px 12px;
      cursor: pointer;
      transition: all .15s;
      white-space: nowrap;
    }

    .qa-btn:hover {
      border-color: rgba(0, 188, 212, .35);
      color: var(--cyan);
      background: rgba(0, 188, 212, .05);
    }

    /* ── INPUT AREA ── */
    .input-area {
      padding: 20px 20px 32px;
      flex-shrink: 0;
      background: transparent;
      transition: all .2s;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .input-tools {
      display: flex;
      gap: 6px;
      margin-bottom: 8px;
      align-items: center;
      flex-wrap: wrap;
      width: 100%;
      max-width: 820px;
    }

    .tool-pill {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 10px;
      font-weight: 500;
      background: var(--pill-bg);
      border: .5px solid var(--pill-bord);
      color: var(--pill-col);
      border-radius: 20px;
      padding: 3px 9px;
      cursor: pointer;
      transition: all .15s;
      white-space: nowrap;
    }

    .tool-pill:hover {
      background: var(--sb-hover);
      color: var(--t2);
    }

    .tool-pill.on {
      background: rgba(0, 188, 212, .1);
      border-color: rgba(0, 188, 212, .3);
      color: var(--cyan);
    }

    .tool-pill-dot {
      width: 4px;
      height: 4px;
      border-radius: 50%;
    }

    .tools-sep {
      width: .5px;
      height: 14px;
      background: var(--bord);
    }

    .input-box {
      display: flex;
      align-items: flex-end;
      gap: 8px;
      background: var(--surf);
      border: .5px solid var(--bord);
      border-radius: 20px;
      padding: 12px 18px;
      transition: all .2s;
      width: 100%;
      max-width: 880px;
      box-shadow: var(--bub-shadow);
    }

    .input-box:focus-within {
      border-color: var(--bord-cyan);
      box-shadow: 0 0 0 3px rgba(0, 188, 212, .15), var(--bub-shadow);
    }

    .input-box textarea {
      flex: 1;
      background: none;
      border: none;
      outline: none;
      font-family: 'Inter', sans-serif;
      font-size: 13.5px;
      color: var(--t1);
      resize: none;
      min-height: 22px;
      max-height: 180px;
      line-height: 1.6;
      padding: 6px 0;
      transition: color .2s;
    }

    .input-box textarea::placeholder {
      color: var(--t3);
    }

    .input-right {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .attach-btn {
      width: 28px;
      height: 28px;
      border-radius: 6px;
      background: none;
      border: .5px solid var(--bord);
      cursor: pointer;
      color: var(--t3);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all .15s;
    }

    .attach-btn:hover {
      color: var(--t2);
      background: var(--surf2);
    }

    .send-btn {
      width: 34px;
      height: 34px;
      border-radius: 8px;
      background: var(--red);
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background .15s;
      flex-shrink: 0;
    }

    .send-btn:hover {
      background: var(--red-dark);
    }

    .send-btn:disabled {
      opacity: .3;
      cursor: not-allowed;
    }

    .input-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 8px;
      width: 100%;
      max-width: 880px;
    }

    .input-hint {
      font-family: 'JetBrains Mono', monospace;
      font-size: 9px;
      color: var(--t3);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .hint-kbd {
      background: var(--surf3);
      border: .5px solid var(--bord);
      border-radius: 3px;
      padding: 1px 5px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 9px;
      transition: background .2s;
    }

    .char-count {
      font-family: 'JetBrains Mono', monospace;
      font-size: 9px;
      color: var(--t3);
    }

    /* ── NOTIFICATION TOAST ── */
    .toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      z-index: 9999;
      background: var(--surf);
      border: .5px solid var(--bord);
      border-radius: 10px;
      padding: 10px 16px;
      display: flex;
      align-items: center;
      gap: 9px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, .25);
      transform: translateY(16px);
      opacity: 0;
      transition: all .25s ease;
      pointer-events: none;
    }

    .toast.show {
      transform: translateY(0);
      opacity: 1;
    }

    .toast-text {
      font-size: 12px;
      color: var(--t1);
    }

    /* ── SEARCH HIGHLIGHT ── */
    .search-bar {
      position: absolute;
      top: 100%;
      right: 0;
      background: var(--drop-bg);
      border: .5px solid var(--drop-bord);
      border-radius: 8px;
      padding: 6px 10px;
      display: flex;
      align-items: center;
      gap: 8px;
      box-shadow: var(--drop-shadow);
      z-index: 400;
      min-width: 240px;
      animation: fadeUp .15s ease;
    }

    .search-bar input {
      background: none;
      border: none;
      outline: none;
      font-size: 12px;
      color: var(--t1);
      font-family: 'Inter', sans-serif;
      width: 180px;
    }

    .search-bar input::placeholder {
      color: var(--t3);
    }

    .search-count {
      font-family: 'JetBrains Mono', monospace;
      font-size: 9px;
      color: var(--t3);
    }

    ::-webkit-scrollbar {
      width: 4px;
    }

    ::-webkit-scrollbar-track {
      background: transparent;
    }

    ::-webkit-scrollbar-thumb {
      background: var(--scroll);
      border-radius: 2px;
    }
  </style>
</head>

<body data-theme="dark">

  <!-- TOAST -->
  <div class="toast" id="toast">

  <div class="app">

                  <path d="M4 4.5a3 3 0 016 0m-8 0v4.5a2 2 0 002 2h4a2 2 0 002-2v-4.5m-6 3.5h2" stroke="currentColor"

              <svg width="13" height="13" viewBox="0 0 13 13" fill="none">

    }

        document.querySelectorAll('.agent-selector,.model-selector').forEach(s => s.classList.remove('open'));

      if (scroll) msgs.scrollTop = msgs.scrollHeight;
      return wrap;

    // stream a text response character by character
    function streamText(container, text, onDone) {
      let i = 0;
      const cursor = document.createElement('span');
      cursor.className = 'stream-cursor';
      container.appendChild(cursor);
      const msgs = document.getElementById('messages');

      function step() {
        if (i < text.length) {
          const chunk = text.slice(i, i + 3);
          cursor.insertAdjacentText('beforebegin', chunk);
          i += chunk.length;
          msgs.scrollTop = msgs.scrollHeight;
          setTimeout(step, 12 + Math.random() * 18);
        } else {
          cursor.remove();
          if (onDone) onDone();
        }
      }
      step();
    }
