<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BIA Tech — Chat v3</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@300;400;500;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --red:        #CC092F;
      --red-dark:   #A00725;
      --red-light:  rgba(204, 9, 47, 0.10);
      --cyan:       #00BCD4;
      --cyan-dark:  #0097A7;
      --cyan-light: rgba(0, 188, 212, 0.10);
      --success:    #2E7D32;
      --warning:    #F9A825;
      --error:      #D32F2F;

      --bg:         #1A1A1A;
      --bg2:        #212121;
      --bg3:        #2A2A2A;
      --surface:    #252525;
      --surface2:   #2E2E2E;
      --surface3:   #363636;

      --text:       #F0F0F0;
      --text2:      #A0A0A0;
      --text3:      #666;

      --border:     rgba(255,255,255,0.07);
      --border2:    rgba(255,255,255,0.04);
      --border-c:   rgba(0,188,212,0.30);

      --code-bg:    #111;
      --scroll:     #3D3D3D;

      --sidebar-w:  260px;
      --transition: 0.15s cubic-bezier(0.2, 0.8, 0.2, 1);
    }

    html, body { height: 100%; background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; font-size: 14px; line-height: 1.5; -webkit-font-smoothing: antialiased; overflow: hidden; }

    /* ──────── APP LAYOUT ──────── */
    .app { display: flex; height: 100vh; overflow: hidden; }

    /* ──────── SIDEBAR ──────── */
    .sidebar {
      width: var(--sidebar-w);
      min-width: var(--sidebar-w);
      background: var(--bg2);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .sidebar-top { padding: 14px 12px 10px; display: flex; flex-direction: column; gap: 2px; }

    .logo { display: flex; align-items: center; gap: 10px; padding: 4px 8px 12px; }
    .logo-icon {
      width: 28px; height: 28px; background: var(--red); border-radius: 6px;
      display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    }
    .logo-icon svg { width: 16px; height: 16px; fill: white; }
    .logo-text { display: flex; flex-direction: column; }
    .logo-name { font-size: 13px; font-weight: 600; color: var(--text); letter-spacing: 0.01em; }
    .logo-name span { font-weight: 300; }
    .logo-sub { font-size: 9px; font-weight: 500; color: var(--text3); letter-spacing: 0.12em; text-transform: uppercase; }

    .btn-new-session {
      display: flex; align-items: center; gap: 8px; width: 100%; padding: 8px 10px;
      background: transparent; border: none; border-radius: 8px; color: var(--text);
      font-family: 'Inter', sans-serif; font-size: 13px; cursor: pointer; transition: background var(--transition); text-align: left;
    }
    .btn-new-session:hover { background: var(--bg3); }
    .btn-new-session .ms { font-size: 18px; color: var(--text2); }

    .sidebar-nav { display: flex; flex-direction: column; gap: 1px; padding: 0 12px 10px; }
    .nav-item {
      display: flex; align-items: center; gap: 8px; width: 100%; padding: 7px 10px;
      background: transparent; border: none; border-radius: 8px; color: var(--text2);
      font-family: 'Inter', sans-serif; font-size: 13px; cursor: pointer;
      transition: background var(--transition), color var(--transition); text-align: left;
    }
    .nav-item:hover { background: var(--bg3); color: var(--text); }
    .nav-item .ms { font-size: 18px; }

    .sidebar-divider { height: 1px; background: var(--border); margin: 4px 12px; }

    .projects-header { display: flex; align-items: center; justify-content: space-between; padding: 8px 14px 6px; }
    .projects-header-label { display: flex; align-items: center; gap: 4px; font-size: 12px; color: var(--text2); cursor: pointer; }
    .projects-header-label .ms { font-size: 14px; }
    .projects-filter { background: transparent; border: none; color: var(--text3); cursor: pointer; padding: 2px; border-radius: 4px; display: flex; align-items: center; transition: color var(--transition); }
    .projects-filter:hover { color: var(--text2); }
    .projects-filter .ms { font-size: 16px; }

    /* agent switcher tabs */
    .agent-tabs { padding: 6px 8px; display: flex; flex-direction: column; gap: 1px; }
    .agent-tab {
      display: flex; align-items: center; gap: 8px; padding: 6px 8px;
      border-radius: 7px; cursor: pointer; transition: background var(--transition);
    }
    .agent-tab:hover { background: var(--bg3); }
    .agent-tab.active { background: var(--surface2); }
    .agent-tab-ico {
      width: 24px; height: 24px; border-radius: 5px;
      display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    }
    .agent-tab-body { flex: 1; overflow: hidden; }
    .agent-tab-name { font-size: 12px; font-weight: 500; color: var(--text2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .agent-tab.active .agent-tab-name { color: var(--text); }
    .agent-tab-role { font-family: 'JetBrains Mono', monospace; font-size: 9px; color: var(--text3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    .sb-section-label { font-size: 11px; font-weight: 500; color: var(--text3); text-transform: uppercase; letter-spacing: 0.08em; padding: 8px 14px 4px; }

    .conv-list { overflow-y: auto; padding: 0 8px 8px; }
    .conv-list::-webkit-scrollbar { width: 3px; }
    .conv-list::-webkit-scrollbar-thumb { background: var(--scroll); border-radius: 2px; }

    .conv-item {
      display: flex; align-items: center; gap: 8px; padding: 6px 8px;
      border-radius: 7px; cursor: pointer; transition: background var(--transition); margin-bottom: 1px;
    }
    .conv-item:hover { background: var(--bg3); }
    .conv-item.active { background: var(--surface2); }
    .conv-ico {
      width: 24px; height: 24px; border-radius: 5px; background: var(--surface3);
      display: flex; align-items: center; justify-content: center; flex-shrink: 0; color: var(--text3);
    }
    .conv-item.active .conv-ico { background: var(--cyan-light); color: var(--cyan); }
    .conv-body { flex: 1; overflow: hidden; }
    .conv-title { font-size: 12px; font-weight: 500; color: var(--text2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .conv-item.active .conv-title { color: var(--text); }
    .conv-meta { font-family: 'JetBrains Mono', monospace; font-size: 9px; color: var(--text3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 1px; }
    .conv-tag { font-family: 'JetBrains Mono', monospace; font-size: 8px; padding: 1px 5px; border-radius: 3px; flex-shrink: 0; font-weight: 500; }

    .sidebar-footer {
      padding: 12px; border-top: 1px solid var(--border);
      display: flex; align-items: center; gap: 10px; margin-top: auto;
    }
    .avatar { width: 30px; height: 30px; background: var(--red); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; color: white; flex-shrink: 0; }
    .user-info { flex: 1; overflow: hidden; }
    .user-name { font-size: 12px; font-weight: 500; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .user-role { font-size: 10px; color: var(--cyan); font-weight: 500; }
    .icon-btn-sm { background: transparent; border: none; color: var(--text3); cursor: pointer; padding: 4px; border-radius: 4px; display: flex; align-items: center; transition: color var(--transition), background var(--transition); }
    .icon-btn-sm:hover { color: var(--text); background: var(--bg3); }
    .icon-btn-sm .ms { font-size: 16px; }

    /* ──────── MAIN ──────── */
    .main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }

    /* chat header */
    .chat-header {
      padding: 10px 18px; border-bottom: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between; flex-shrink: 0;
    }
    .chat-header-left { display: flex; align-items: center; gap: 10px; }
    .chat-header-right { display: flex; align-items: center; gap: 6px; }

    .chat-agent-badge {
      display: flex; align-items: center; gap: 7px; padding: 5px 10px;
      background: var(--surface); border: 0.5px solid var(--border); border-radius: 8px;
      cursor: pointer; transition: border-color var(--transition), background var(--transition);
      position: relative;
    }
    .chat-agent-badge:hover { border-color: var(--border-c); }
    .chat-agent-badge.open { border-color: var(--border-c); box-shadow: 0 0 0 3px var(--cyan-light); }
    .cab-icon { width: 20px; height: 20px; border-radius: 4px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .cab-name { font-size: 12px; font-weight: 600; color: var(--text); }
    .cab-role { font-family: 'JetBrains Mono', monospace; font-size: 9px; color: var(--text3); }
    .cab-chevron { color: var(--text3); font-size: 14px; transition: transform 0.2s; }
    .chat-agent-badge.open .cab-chevron { transform: rotate(180deg); }

    .session-label { font-size: 12px; font-weight: 500; color: var(--text3); max-width: 200px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    .topbar-icon-btn {
      width: 30px; height: 30px; border-radius: 7px; background: transparent;
      border: 0.5px solid var(--border); cursor: pointer; color: var(--text3);
      display: flex; align-items: center; justify-content: center; transition: all var(--transition);
    }
    .topbar-icon-btn:hover { color: var(--text2); background: var(--bg3); }
    .topbar-icon-btn .ms { font-size: 16px; }

    .theme-toggle {
      display: flex; align-items: center; gap: 5px; padding: 4px 10px;
      background: var(--surface); border: 0.5px solid var(--border); border-radius: 20px;
      cursor: pointer; font-family: 'JetBrains Mono', monospace; font-size: 10px; color: var(--text3);
      transition: all var(--transition);
    }
    .theme-toggle:hover { border-color: var(--border-c); color: var(--cyan); }

    /* ──────── DROPDOWN ──────── */
    .dropdown {
      position: absolute; top: calc(100% + 8px); left: 0;
      background: var(--surface); border: 0.5px solid rgba(255,255,255,0.12);
      border-radius: 12px; box-shadow: 0 16px 48px rgba(0,0,0,0.45);
      z-index: 500; overflow: hidden; opacity: 0;
      transform: translateY(-8px) scale(0.98); pointer-events: none;
      transition: opacity 0.18s, transform 0.18s; min-width: 260px;
    }
    .dropdown.open { opacity: 1; transform: translateY(0) scale(1); pointer-events: all; }
    .drop-header { padding: 10px 14px 8px; font-family: 'JetBrains Mono', monospace; font-size: 9px; color: var(--text3); letter-spacing: 0.14em; text-transform: uppercase; border-bottom: 0.5px solid var(--border2); }
    .drop-item { display: flex; align-items: center; gap: 11px; padding: 10px 14px; cursor: pointer; transition: background 0.12s; border-bottom: 0.5px solid var(--border2); }
    .drop-item:last-child { border-bottom: none; }
    .drop-item:hover { background: var(--bg3); }
    .drop-item.selected { background: var(--cyan-light); }
    .drop-icon { width: 34px; height: 34px; border-radius: 9px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; }
    .drop-name { font-size: 12px; font-weight: 600; color: var(--text); margin-bottom: 2px; }
    .drop-desc { font-size: 10px; color: var(--text3); line-height: 1.4; }
    .drop-check { width: 16px; height: 16px; border-radius: 4px; background: var(--cyan-light); border: 0.5px solid rgba(0,188,212,0.4); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }

    .model-drop { min-width: 320px; }
    .model-drop-item { display: flex; align-items: center; gap: 10px; padding: 10px 14px; cursor: pointer; transition: background 0.12s; border-bottom: 0.5px solid var(--border2); }
    .model-drop-item:last-child { border-bottom: none; }
    .model-drop-item:hover { background: var(--bg3); }
    .model-drop-item.selected { background: var(--cyan-light); }
    .model-logo-big { width: 32px; height: 32px; border-radius: 8px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; color: var(--text2); }
    .model-info { flex: 1; }
    .model-name { font-size: 12px; font-weight: 600; color: var(--text); margin-bottom: 2px; }
    .model-desc { font-size: 10px; color: var(--text3); }
    .model-tags { display: flex; gap: 4px; margin-top: 4px; }
    .mtag { font-family: 'JetBrains Mono', monospace; font-size: 8px; padding: 1px 6px; border-radius: 3px; font-weight: 500; }
    .mtag-fast { background: rgba(249,168,37,.12); color: #F9A825; }
    .mtag-smart { background: var(--cyan-light); color: var(--cyan); }
    .mtag-reason { background: rgba(21,101,192,.12); color: #64B5F6; }
    .mtag-vision { background: rgba(123,31,162,.12); color: #CE93D8; }
    .mtag-code { background: rgba(46,125,50,.12); color: #81C784; }

    /* cap chips */
    .cap-chips { padding: 8px 18px; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; border-bottom: 0.5px solid var(--border2); flex-shrink: 0; }
    .cap-chip { display: flex; align-items: center; gap: 5px; font-size: 10px; font-weight: 500; background: var(--surface); border: 0.5px solid var(--border); color: var(--text3); border-radius: 20px; padding: 3px 9px; }
    .cap-chip.active { background: var(--cyan-light); border-color: rgba(0,188,212,0.3); color: var(--cyan); }
    .cap-chip-dot { width: 5px; height: 5px; border-radius: 50%; }

    /* ──────── MESSAGES ──────── */
    .messages { flex: 1; overflow-y: auto; padding: 20px 20px 8px; display: flex; flex-direction: column; gap: 0; align-items: center; }
    .messages::-webkit-scrollbar { width: 4px; }
    .messages::-webkit-scrollbar-thumb { background: var(--scroll); border-radius: 2px; }

    .msg-wrap { padding: 2px 0; animation: fadeUp 0.2s ease; width: 100%; max-width: 860px; }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

    .date-sep { display: flex; align-items: center; gap: 10px; padding: 12px 0 8px; width: 100%; max-width: 860px; align-self: center; }
    .date-line { flex: 1; height: 0.5px; background: var(--border); }
    .date-text { font-family: 'JetBrains Mono', monospace; font-size: 9px; letter-spacing: 0.1em; color: var(--text3); white-space: nowrap; }

    .msg-row { display: flex; gap: 10px; align-items: flex-start; max-width: 860px; }
    .msg-row.user-row { margin-left: auto; flex-direction: row-reverse; max-width: 680px; }

    .msg-avatar { width: 28px; height: 28px; border-radius: 5px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; margin-top: 2px; }
    .msg-avatar.bia { background: var(--red); }
    .msg-avatar.user { background: var(--surface3); border: 0.5px solid var(--border); }

    .msg-content { flex: 1; }
    .msg-header { display: flex; align-items: center; gap: 7px; margin-bottom: 5px; }
    .msg-row.user-row .msg-header { flex-direction: row-reverse; }
    .msg-author { font-size: 11px; font-weight: 600; color: var(--text); }
    .msg-author.bia { color: var(--red); }
    .msg-time { font-family: 'JetBrains Mono', monospace; font-size: 9px; color: var(--text3); }
    .ia-badge { display: inline-flex; align-items: center; gap: 4px; background: var(--cyan-light); border: 0.5px solid rgba(0,188,212,0.25); border-radius: 3px; padding: 1px 7px; font-family: 'JetBrains Mono', monospace; font-size: 9px; color: var(--cyan); }

    .msg-row.user-row .msg-content { background: var(--surface); border: 0.5px solid var(--border); border-radius: 12px 2px 12px 12px; padding: 10px 14px; }
    .msg-body { font-size: 13.5px; color: var(--text); line-height: 1.72; }
    .msg-body p { margin-bottom: 10px; }
    .msg-body p:last-child { margin-bottom: 0; }
    .msg-body strong { font-weight: 600; }
    .msg-body code { font-family: 'JetBrains Mono', monospace; font-size: 11.5px; background: rgba(255,255,255,0.08); color: var(--cyan); padding: 1px 5px; border-radius: 3px; }

    /* thinking */
    .thinking-block { border-left: 2px solid var(--text3); margin: 6px 0 10px; padding: 3px 0 3px 12px; color: var(--text3); font-size: 11.5px; font-style: italic; }

    /* code block */
    .code-block { background: var(--code-bg); border: 0.5px solid rgba(255,255,255,0.06); border-radius: 9px; margin: 10px 0; overflow: hidden; }
    .code-header { display: flex; align-items: center; justify-content: space-between; padding: 8px 14px; border-bottom: 0.5px solid rgba(255,255,255,0.06); }
    .code-lang { font-family: 'JetBrains Mono', monospace; font-size: 10px; font-weight: 500; color: var(--cyan); letter-spacing: 0.06em; }
    .code-actions { display: flex; gap: 6px; align-items: center; }
    .code-copy { font-family: 'JetBrains Mono', monospace; font-size: 9px; color: var(--text3); background: none; border: 0.5px solid transparent; border-radius: 4px; padding: 2px 7px; cursor: pointer; display: flex; align-items: center; gap: 4px; transition: all var(--transition); }
    .code-copy:hover { color: var(--text2); border-color: var(--border); background: var(--surface); }
    .code-run { font-family: 'JetBrains Mono', monospace; font-size: 9px; background: var(--cyan-light); border: 0.5px solid rgba(0,188,212,0.25); color: var(--cyan); border-radius: 4px; padding: 2px 8px; cursor: pointer; transition: all var(--transition); }
    .code-run:hover { background: rgba(0,188,212,0.18); }
    .code-body { padding: 14px; overflow-x: auto; font-family: 'JetBrains Mono', monospace; font-size: 12px; line-height: 1.8; color: var(--text); }
    .tok-kw { color: var(--red); font-weight: 500; }
    .tok-fn { color: var(--cyan); }
    .tok-str { color: #81C784; }
    .tok-cmt { color: var(--text3); font-style: italic; }
    .tok-num { color: #F9A825; }
    .tok-type { color: #CE93D8; }

    /* tool block */
    .tool-block { display: flex; align-items: flex-start; gap: 9px; background: var(--cyan-light); border: 0.5px solid rgba(0,188,212,0.15); border-radius: 8px; padding: 9px 13px; margin: 6px 0; }
    .tool-ico { width: 22px; height: 22px; border-radius: 5px; background: rgba(0,188,212,0.12); display: flex; align-items: center; justify-content: center; flex-shrink: 0; margin-top: 1px; color: var(--cyan); }
    .tool-name { font-family: 'JetBrains Mono', monospace; font-size: 10px; font-weight: 500; color: var(--cyan); margin-bottom: 1px; }
    .tool-desc-txt { font-size: 10px; color: var(--text2); }
    .tool-stat { font-family: 'JetBrains Mono', monospace; font-size: 9px; padding: 2px 7px; border-radius: 3px; flex-shrink: 0; align-self: center; }
    .tool-stat.done { background: rgba(46,125,50,0.12); color: #81C784; border: 0.5px solid rgba(46,125,50,0.2); }
    .tool-stat.running { background: var(--cyan-light); color: var(--cyan); border: 0.5px solid rgba(0,188,212,0.2); animation: blink-a 1.4s infinite; }
    @keyframes blink-a { 0%,100% { opacity:1; } 50% { opacity:.35; } }

    /* typing */
    .typing-row { display: flex; align-items: center; gap: 4px; padding: 4px 0; }
    .tdot { width: 5px; height: 5px; border-radius: 50%; background: var(--text3); animation: typing 1.4s ease infinite; }
    .tdot:nth-child(2) { animation-delay: .2s; }
    .tdot:nth-child(3) { animation-delay: .4s; }
    @keyframes typing { 0%,80%,100% { transform:scale(1); opacity:.4; } 40% { transform:scale(1.3); opacity:1; } }

    /* stream cursor */
    .stream-cursor { display: inline-block; width: 2px; height: 14px; background: var(--cyan); margin-left: 2px; vertical-align: middle; border-radius: 1px; animation: blink-cur .7s step-end infinite; }
    @keyframes blink-cur { 0%,100% { opacity:1; } 50% { opacity:0; } }

    /* reactions */
    .reaction-bar { display: flex; align-items: center; gap: 4px; margin-top: 6px; opacity: 0; transition: opacity 0.2s; }
    .msg-wrap:hover .reaction-bar { opacity: 1; }
    .react-btn { font-size: 11px; padding: 2px 6px; border-radius: 4px; border: 0.5px solid var(--border); background: none; cursor: pointer; color: var(--text3); transition: all var(--transition); }
    .react-btn:hover { background: var(--surface); color: var(--text2); }
    .react-btn.active { background: var(--cyan-light); border-color: rgba(0,188,212,0.3); color: var(--cyan); }
    .copy-msg-btn { font-family: 'JetBrains Mono', monospace; font-size: 9px; padding: 2px 7px; border-radius: 4px; border: 0.5px solid var(--border); background: none; cursor: pointer; color: var(--text3); transition: all var(--transition); display: flex; align-items: center; gap: 3px; }
    .copy-msg-btn:hover { background: var(--surface); color: var(--text2); }

    /* ──────── QUICK ACTIONS ──────── */
    .quick-actions { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; width: 100%; max-width: 860px; margin-bottom: 10px; }
    .quick-actions::-webkit-scrollbar { display: none; }
    .qa-btn { display: flex; align-items: center; gap: 6px; flex-shrink: 0; font-size: 11px; font-weight: 500; background: var(--surface); border: 0.5px solid var(--border); color: var(--text2); border-radius: 20px; padding: 5px 12px; cursor: pointer; transition: all var(--transition); white-space: nowrap; }
    .qa-btn:hover { border-color: var(--border-c); color: var(--cyan); background: var(--cyan-light); }

    /* ──────── INPUT AREA ──────── */
    .input-area { padding: 0 20px 12px; flex-shrink: 0; display: flex; flex-direction: column; align-items: center; }

    .input-box {
      background: var(--surface); border: 1px solid var(--border); border-radius: 14px; overflow: hidden;
      transition: border-color var(--transition), box-shadow var(--transition); width: 100%; max-width: 860px;
    }
    .input-box:focus-within { border-color: rgba(0,188,212,0.3); box-shadow: 0 0 0 3px var(--cyan-light); }

    .input-field { width: 100%; background: transparent; border: none; outline: none; color: var(--text); font-family: 'Inter', sans-serif; font-size: 14px; padding: 14px 16px 8px; resize: none; line-height: 1.6; max-height: 180px; }
    .input-field::placeholder { color: var(--text3); }

    .input-toolbar { display: flex; align-items: center; justify-content: space-between; padding: 6px 10px 10px; }
    .input-toolbar-left { display: flex; align-items: center; gap: 4px; }
    .input-toolbar-right { display: flex; align-items: center; gap: 8px; }

    .toolbar-btn { display: flex; align-items: center; gap: 5px; padding: 4px 8px; background: transparent; border: none; border-radius: 6px; color: var(--text3); font-family: 'Inter', sans-serif; font-size: 12px; cursor: pointer; transition: background var(--transition), color var(--transition); }
    .toolbar-btn:hover { background: var(--bg3); color: var(--text2); }
    .toolbar-btn .ms { font-size: 16px; }

    /* mini agent/model selector inside input */
    .mini-sel { display: flex; align-items: center; justify-content: center; width: 28px; height: 28px; background: transparent; border: 0.5px solid var(--border); border-radius: 6px; cursor: pointer; color: var(--text3); transition: all var(--transition); position: relative; flex-shrink: 0; }
    .mini-sel:hover { background: var(--bg3); color: var(--text2); }
    .mini-sel.open { background: var(--bg3); border-color: var(--border-c); color: var(--cyan); }
    .mini-drop { top: auto; bottom: calc(100% + 10px); left: auto; right: -10px; transform: translateY(8px) scale(.98); }
    .mini-drop.open { transform: translateY(0) scale(1); }

    .model-selector-inline { display: flex; align-items: center; gap: 5px; padding: 4px 8px; background: transparent; border: none; border-radius: 6px; color: var(--text2); font-family: 'Inter', sans-serif; font-size: 12px; font-weight: 500; cursor: pointer; transition: background var(--transition); position: relative; }
    .model-selector-inline:hover { background: var(--bg3); }
    .model-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--cyan); animation: pulse-c 2.5s ease-in-out infinite; }
    @keyframes pulse-c { 0%,100% { opacity:1; } 50% { opacity:.4; } }
    .model-selector-inline .ms { font-size: 14px; color: var(--text3); }

    .send-btn { width: 30px; height: 30px; border-radius: 8px; background: var(--red); border: none; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: background var(--transition), transform var(--transition); flex-shrink: 0; }
    .send-btn:hover { background: var(--red-dark); transform: scale(1.05); }
    .send-btn .ms { font-size: 16px; color: white; }

    .input-hint-row { display: flex; align-items: center; justify-content: space-between; margin-top: 6px; width: 100%; max-width: 860px; }
    .input-hint { font-family: 'JetBrains Mono', monospace; font-size: 9px; color: var(--text3); display: flex; align-items: center; gap: 6px; }
    .hint-kbd { background: var(--surface3); border: 0.5px solid var(--border); border-radius: 3px; padding: 1px 5px; font-family: 'JetBrains Mono', monospace; font-size: 9px; }
    .char-count { font-family: 'JetBrains Mono', monospace; font-size: 9px; color: var(--text3); }

    /* ──────── STATUS BAR ──────── */
    .statusbar { padding: 0 20px 14px; display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; }
    .statusbar-left { display: flex; align-items: center; gap: 4px; }
    .statusbar-right { display: flex; align-items: center; gap: 6px; }
    .status-pill { display: flex; align-items: center; gap: 5px; padding: 4px 10px; background: var(--surface); border: 1px solid var(--border); border-radius: 20px; font-size: 11.5px; color: var(--text2); cursor: pointer; transition: all var(--transition); font-weight: 400; }
    .status-pill:hover { background: var(--bg3); border-color: rgba(255,255,255,0.12); }
    .status-pill .ms { font-size: 13px; }
    .status-badge { display: flex; align-items: center; gap: 5px; padding: 4px 10px; background: var(--surface); border: 1px solid var(--border); border-radius: 20px; font-size: 11.5px; cursor: pointer; transition: all var(--transition); }
    .status-badge:hover { background: var(--bg3); }
    .status-badge.active { background: var(--cyan-light); border-color: rgba(0,188,212,0.25); color: var(--cyan); }
    .status-badge .ms { font-size: 13px; color: var(--text3); }
    .status-badge.active .ms { color: var(--cyan); }
    .status-badge span { font-size: 11.5px; font-weight: 500; }

    /* ──────── EMPTY STATE ──────── */
    .empty-state { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0; padding: 40px; }
    .greeting { font-size: 22px; font-weight: 600; color: var(--text); letter-spacing: -0.01em; text-align: center; margin-bottom: 6px; }
    .greeting-sub { font-size: 13px; color: var(--text3); text-align: center; margin-bottom: 28px; line-height: 1.6; }
    .greeting-sub strong { color: var(--cyan); font-weight: 500; }
    .suggestions { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; max-width: 520px; }
    .suggestion-chip { display: flex; align-items: center; gap: 6px; padding: 8px 14px; background: var(--surface); border: 1px solid var(--border); border-radius: 20px; font-size: 12.5px; color: var(--text2); cursor: pointer; transition: all var(--transition); font-family: 'Inter', sans-serif; }
    .suggestion-chip:hover { background: var(--bg3); border-color: rgba(0,188,212,0.3); color: var(--text); }
    .suggestion-chip .ms { font-size: 14px; color: var(--cyan); }

    /* ──────── TOAST ──────── */
    .toast { position: fixed; bottom: 24px; right: 24px; z-index: 9999; background: var(--surface); border: 0.5px solid var(--border); border-radius: 10px; padding: 10px 16px; display: flex; align-items: center; gap: 9px; box-shadow: 0 8px 32px rgba(0,0,0,.4); transform: translateY(16px); opacity: 0; transition: all .25s ease; pointer-events: none; }
    .toast.show { transform: translateY(0); opacity: 1; }
    .toast-text { font-size: 12px; color: var(--text); }

    /* ──────── SCROLLBARS ──────── */
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--scroll); border-radius: 2px; }

    /* search bar */
    .search-bar { background: var(--surface); border: 0.5px solid rgba(255,255,255,0.12); border-radius: 8px; padding: 6px 10px; display: flex; align-items: center; gap: 8px; box-shadow: 0 8px 24px rgba(0,0,0,0.3); z-index: 400; min-width: 240px; }
    .search-bar input { background: none; border: none; outline: none; font-size: 12px; color: var(--text); font-family: 'Inter', sans-serif; width: 180px; }
    .search-bar input::placeholder { color: var(--text3); }
    .search-count { font-family: 'JetBrains Mono', monospace; font-size: 9px; color: var(--text3); }

    /* light theme */
    body.light {
      --bg: #FFFFFF; --bg2: #F8F8F8; --bg3: #F0F0F0; --surface: #FFFFFF; --surface2: #F0F0F0; --surface3: #E8E8E8;
      --text: #1A1A1A; --text2: #666; --text3: #AAA; --border: rgba(0,0,0,0.09); --border2: rgba(0,0,0,0.05);
      --code-bg: #F4F4F4; --scroll: #CCC; --cyan-light: rgba(0,188,212,0.08); --red-light: rgba(204,9,47,0.06);
    }
  </style>
</head>
<body>

<!-- TOAST -->

<div class="app">

<script>

      tools:[{name:'query_planner()',desc:'Analisando plano de execução e índices',time:'44ms'},{name:'schema_analyzer()',desc:'Verificando cardinalidade e estatísticas',time:'23ms'}],

  // ─── CODE COPY ───
  function copyCode(btn) {
    const text=btn.closest('.code-block').querySelector('.code-body').innerText;
    navigator.clipboard.writeText(text).catch(()=>{});
    const orig=btn.innerHTML; btn.innerHTML='✓ copiado'; btn.style.color='var(--cyan)';
    setTimeout(()=>{ btn.innerHTML=orig; btn.style.color=''; },2000);
    showToast('Código copiado!');
  }

  // ─── TOAST ───
  let toastTimer;
  function showToast(msg) {
    const t=document.getElementById('toast'); document.getElementById('toastText').textContent=msg;
    t.classList.add('show'); clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.remove('show'),2200);
  }

  // ─── SEARCH ───
  function toggleSearch() {
    const wrap=document.getElementById('searchBarWrap');
    const hidden=wrap.style.display==='none';
    wrap.style.display=hidden?'block':'none';
    if(hidden) wrap.querySelector('input').focus();
  }
  function searchMsgs(q) {
    const all=document.querySelectorAll('.msg-body'); let found=0;
    all.forEach(el=>{ el.style.background=''; if(q&&el.innerText.toLowerCase().includes(q.toLowerCase())){ el.style.background='rgba(249,168,37,.1)'; found++; } });
    document.getElementById('searchCount').textContent=q?`${found} resultado${found!==1?'s':''}`:'';
  }

  // ─── NEW CHAT ───
  function newChat(renderMsg=true) {
    document.querySelectorAll('.conv-item').forEach(c=>c.classList.remove('active'));
    document.getElementById('messages').innerHTML='';
    document.getElementById('sessionLabel').textContent='Nova conversa';
    if(renderMsg) renderInitialMsg();
  }

  // ─── INITIAL MESSAGE ───
  function renderInitialMsg() {
    const agent=activeAgent;
    const lines=agent.initMsg.split('\n').filter(l=>l.trim());
    appendMsg(`<div class="date-sep"><div class="date-line"></div><div class="date-text">AGORA</div><div class="date-line"></div></div>
    <div class="msg-row">${biaAvatar()}<div class="msg-content">
      <div class="msg-header"><span class="msg-author bia">${agent.name}</span><span class="msg-time">${nowT()}</span><span class="ia-badge">IA ativo</span></div>
      <div class="msg-body" id="init-body"></div>${reactionBar()}
    </div></div>`, false);

    const body=document.getElementById('init-body');
    lines.forEach(line=>{
      const p=document.createElement('p');
      p.innerHTML=line.replace(/\*\*(.*?)\*\*/g,'<strong>$1</strong>');
      body.appendChild(p);
    });
    document.getElementById('messages').scrollTop=999999;
  }

  // ─── INIT ───
  function init() {

    renderDemoConversation();
  }
  init();

  // click suggestion chips
  document.addEventListener('click', e => {
    const chip = e.target.closest('.suggestion-chip');
    if (chip) {
      const inp = document.getElementById('chatInput');
      const msEl = chip.querySelector('.ms');
      const text = [...chip.childNodes].filter(n=>n.nodeType===3).map(n=>n.textContent.trim()).filter(Boolean).join('');
      inp.value = (text || chip.textContent.replace(/\s+/g,' ').trim()) + ' ';
      inp.focus(); autoResize(inp);
    }
  });
